name: CI
on: [push, pull_request]

jobs:
  # Unit tests: no data or database needed (database tests skip themselves)
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # CPU-only PyTorch keeps the CI install small and fast
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-lock.txt  # exact versions behind the published results
      - run: pytest -q

  # End to end on a clean machine: pinned NASA data -> PostgreSQL pipeline -> features -> every verifier
  verify:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pdm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/pdm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-lock.txt  # exact versions behind the published results
      - name: Download NASA C-MAPSS and check it against the pinned checksums
        run: python -m pipeline.download_data
      - name: Raw data integrity
        run: python -m pipeline.check_raw_data
      - name: Pipeline into PostgreSQL (train, then five test shifts)
        run: |
          python -m pipeline.run_batch --init
          python -m pipeline.run_batch --split train --all
          for i in 1 2 3 4 5; do python -m pipeline.run_batch --next; done
      - name: Features
        run: |
          python -m features.run_features --build train
          python -m features.run_features --build test
      - name: Tests, now including the database tests
        run: pytest -q
      - name: Phase 3 verification (features vs independent recomputation)
        run: python -m features.verify
      - name: Phase 4 verification (published metrics, model choice, generated docs)
        run: python -m models.verify_baselines
      - name: Phase 5 verification (deep models, MC-dropout coverage, re-training check, generated docs)
        run: python -m models.verify_deep
      - name: Phase 5b verification (FD003 confirmation, pre-registered tests, rule-E intervals, re-training check)
        run: python -m models.verify_fd003
      - name: Committed files are unchanged by the run
        run: git diff --exit-code -- features/ pipeline/sensor_limits.json models/ docs/MODEL_METRICS.md docs/MODEL_METRICS_PHASE5.md docs/MODEL_METRICS_PHASE5B.md
